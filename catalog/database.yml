mariadb:
  name: "MariaDB"
  description: "Systeme de gestion de base de donnees pour les differents containers presents"
  image: "mariadb:latest"
  ports: []
  depends_on: []
  folders:
    - host: "/srv/mariadb/data"
      container: "/var/lib/mysql"
  resources:
    ram_mb: 512
    disk_gb: 2
  env:
    MARIADB_ROOT_PASSWORD: "change-me"
